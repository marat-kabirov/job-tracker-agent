[project]
name = "job-tracker-agent"
version = "0.1.0"
description = "AI Job Application Tracker Agent — MCP server + LangGraph agent that scores job postings against a resume profile and tracks applications over time."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*", "agent*"]

[tool.pytest.ini_options]
markers = [
    "real_semantic_match: opt out of the autouse _semantic_skill_match mock in test_scoring_deterministic.py to exercise the real Groq call",
]
